<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<title>ITALIA 2026 · 我们的意大利旅行</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-root"></div>
<script>
Promise.all([1,2,3,4].map(i=>fetch(`content-${i}.html`).then(r=>r.text())))
  .then(parts=>{document.getElementById('site-root').innerHTML=parts.join('\n'); const s=document.createElement('script'); s.src='app.js'; document.body.appendChild(s);})
  .catch(err=>{document.getElementById('site-root').innerHTML='<p style="padding:24px">页面加载失败，请刷新重试。</p>'; console.error(err);});
</script>
</body>
</html>
